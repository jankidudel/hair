<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title desc"><title id="title">Powered head versus manual tool turning</title><desc id="desc">Schematic sequence: Powered: handle still; Head rotates ↻; Fixed: hand turns; Head follows hand. Boxes are not drawn to scale.</desc><rect width="720" height="190" fill="#fffdf8"/><text x="18" y="35" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173c39">Powered head versus manual tool turning</text><rect x="18" y="63" width="156" height="82" rx="14" fill="#f2f6f1" stroke="#395a54" stroke-width="2"/><text x="96" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c39">Powered: handle</text><text x="96" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c39">still</text><path d="M176 104h17m-6-6 6 6-6 6" stroke="#875b3c" stroke-width="2" fill="none"/><rect x="196" y="63" width="156" height="82" rx="14" fill="#f2f6f1" stroke="#395a54" stroke-width="2"/><text x="274" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c39">Head rotates ↻</text><path d="M354 104h17m-6-6 6 6-6 6" stroke="#875b3c" stroke-width="2" fill="none"/><rect x="374" y="63" width="156" height="82" rx="14" fill="#f2f6f1" stroke="#395a54" stroke-width="2"/><text x="452" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c39">Fixed: hand turns</text><path d="M532 104h17m-6-6 6 6-6 6" stroke="#875b3c" stroke-width="2" fill="none"/><rect x="552" y="63" width="156" height="82" rx="14" fill="#f2f6f1" stroke="#395a54" stroke-width="2"/><text x="630" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c39">Head follows hand</text><text x="18" y="175" font-family="Arial,sans-serif" font-size="12" fill="#52645f">Schematic only · not a measured product drawing</text></svg>