<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Bob work zones</title><desc id="desc">Back and nape occupy the lower rear; sides flank the head; short face-framing pieces are worked separately.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Bob work zones</text><circle cx="240" cy="142" r="68" fill="#f3e9db" stroke="#315f59" stroke-width="2"/><rect x="175" y="175" width="130" height="68" rx="30" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><text x="240" y="216" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">back / nape</text><rect x="67" y="120" width="90" height="73" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="112" y="162" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">side</text><rect x="323" y="120" width="90" height="73" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="368" y="162" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">side</text><line x1="181" y1="76" x2="133" y2="58" stroke="#875b3c" stroke-width="7" stroke-linecap="round" /><text x="20" y="52" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">face frame</text><line x1="299" y1="76" x2="347" y2="58" stroke="#875b3c" stroke-width="7" stroke-linecap="round" /><text x="240" y="277" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">work lower layers before sides</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>