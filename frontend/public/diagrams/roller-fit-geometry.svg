<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Roller fit geometry</title><desc id="desc">Roller diameter crosses the cylinder; working width runs along it; the section sits over the roller and a closure needs space at the ends.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Roller fit geometry</text><rect x="85" y="110" width="310" height="92" rx="46" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><line x1="85" y1="155" x2="395" y2="155" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><text x="240" y="145" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">working width</text><line x1="70" y1="105" x2="70" y2="207" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><text x="20" y="235" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">diameter</text><line x1="130" y1="79" x2="352" y2="79" stroke="#875b3c" stroke-width="8" stroke-linecap="round" /><text x="240" y="65" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">hair section</text><rect x="75" y="215" width="34" height="26" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><rect x="371" y="215" width="34" height="26" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="240" y="268" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">allow closure space at ends</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>