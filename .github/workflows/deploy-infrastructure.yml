name: Deploy infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infrastructure-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy infrastructure prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      CONTACT_SES_FROM: ${{ vars.CONTACT_SES_FROM }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Verify Google site verification configuration
        if: ${{ env.GOOGLE_SITE_VERIFICATION == '' }}
        run: |
          echo "::error::GOOGLE_SITE_VERIFICATION is not available in the prod GitHub Environment."
          exit 1
      - run: npm run lint && npm run test && npm run infra:build
      - name: Show non-secret OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const encodedPayload = token.split('.')[1];
            const claims = JSON.parse(Buffer.from(encodedPayload, 'base64url').toString('utf8'));
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              environment: claims.environment,
            }, null, 2));
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
      - name: Show infrastructure changes
        run: npm run infra:diff:prod
      - name: Deploy infrastructure and API
        working-directory: infra
        env:
          CONTACT_ORIGIN_KEY: ${{ secrets.CONTACT_ORIGIN_KEY }}
        run: |
          npm run synth
          contact_parameters=()
          if [[ -n "$CONTACT_SES_FROM" ]]; then
            if [[ ! "$CONTACT_ORIGIN_KEY" =~ ^[a-zA-Z0-9]{40,64}$ ]]; then
              echo "::error::Set CONTACT_ORIGIN_KEY to a random 40–64 character alphanumeric secret."
              exit 1
            fi
            contact_parameters=(--parameters "ContactOriginKey=$CONTACT_ORIGIN_KEY")
          fi
          npx cdk deploy Hair-prod --require-approval never --outputs-file cdk-outputs.json "${contact_parameters[@]}"
          cat cdk-outputs.json
