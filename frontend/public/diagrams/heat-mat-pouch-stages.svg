<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Rest, cool and store</title><desc id="desc">An open mat is a rest surface during styling; after cooling under exact directions, a pouch closes for storage.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Rest, cool and store</text><text x="20" y="70" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Open mat · styling rest</text><rect x="25" y="85" width="175" height="87" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><rect x="55" y="111" width="116" height="28" rx="12" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><line x1="214" y1="130" x2="310" y2="130" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M302 124 L310 130 L302 136" fill="none" stroke="#315f59" stroke-width="3"/><text x="325" y="135" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">cool</text><text x="20" y="225" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Closed pouch · storage</text><rect x="25" y="237" width="175" height="52" rx="12" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><line x1="35" y1="246" x2="190" y2="246" stroke="#875b3c" stroke-width="4" stroke-linecap="round" /><text x="224" y="267" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">only as directions permit</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>