name: Frontend validation

on:
  workflow_call:
    inputs:
      check-generated-seo:
        description: Build and inspect the generated production SEO output
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run content:check
      - run: npm run check:seo
        if: ${{ inputs.check-generated-seo }}
      - run: npm run check:editorial-targets
        if: ${{ !inputs.check-generated-seo }}
      - name: Upload generated site on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-output
          path: frontend/dist/hair-frontend/browser
          if-no-files-found: ignore
