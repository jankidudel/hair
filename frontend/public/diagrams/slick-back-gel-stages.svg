<svg xmlns="http://www.w3.org/2000/svg" width="340" height="660" viewBox="0 0 340 660" role="img" aria-labelledby="title"><title id="title">Slick-back gel stages: distribute, arrange and follow setting directions</title><rect width="340" height="660" rx="16" fill="#fffaf3"/><g font-family="Arial, sans-serif" fill="#283b3a"><g transform="translate(0 12)"><rect x="12" width="316" height="204" rx="12" fill="#edf3ef" stroke="#71837b"/><text x="26" y="27" font-size="16" font-weight="700"><tspan x="26" dy="0">Distribute to the intended area</tspan></text><text x="26" y="52" font-size="14" font-weight="400"><tspan x="26" dy="0">Follow the exact gel&#x27;s starting state</tspan></text><rect x="47" y="91" width="174" height="96" rx="12" fill="#fffaf3" stroke="#71837b" stroke-dasharray="5 4"/><path d="M61 143q55-40 144-12m-144 23q55-40 144-12m-144 23q55-40 144-12m-144 23q55-40 144-12" fill="none" stroke="#8b573f" stroke-width="3"/><path d="M259 153v-25q0-10 8-10t8 10v9-28q0-9 8-9t8 9v44q0 17-16 17h-7q-10 0-16-12l-10-17q-4-9 4-11l13 14" fill="#fffaf3" stroke="#294d49" stroke-width="2"/></g><g transform="translate(0 228)"><rect x="12" width="316" height="204" rx="12" fill="#edf3ef" stroke="#71837b"/><text x="26" y="27" font-size="16" font-weight="700"><tspan x="26" dy="0">Arrange the backward outline</tspan></text><text x="26" y="52" font-size="14" font-weight="400"><tspan x="26" dy="0">Work without pulling</tspan><tspan x="26" dy="20">through resistance</tspan></text><path d="M61 143q55-40 144-12m-144 23q55-40 144-12m-144 23q55-40 144-12m-144 23q55-40 144-12" fill="none" stroke="#8b573f" stroke-width="3"/><path d="M69 107q61-28 131-5m-9-9 10 9-13 6" fill="none" stroke="#294d49" stroke-width="2" stroke-dasharray="5 4"/><g transform="translate(247 106) rotate(15)"><rect width="20" height="74" rx="5" fill="#fffaf3" stroke="#294d49" stroke-width="2"/><path d="M0 10h-13m13 10h-13m13 10h-13m13 10h-13m13 10h-13m13 10h-13" stroke="#294d49" stroke-width="2"/></g></g><g transform="trans