<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Short hair work zones</title><desc id="desc">Back and nape, sides, and face frame are separate short-hair brush zones; use one reachable section at a time.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Short hair work zones</text><circle cx="240" cy="142" r="68" fill="#f3e9db" stroke="#315f59" stroke-width="2"/><rect x="180" y="180" width="120" height="58" rx="12" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><text x="240" y="215" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">nape</text><rect x="63" y="124" width="94" height="65" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="110" y="163" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">side</text><rect x="323" y="124" width="94" height="65" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="370" y="163" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">side</text><line x1="175" y1="74" x2="126" y2="60" stroke="#875b3c" stroke-width="7" stroke-linecap="round" /><text x="20" y="51" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">face frame</text><text x="240" y="275" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">choose a reachable head</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>