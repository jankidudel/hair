<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="t d"><title id="t">Wide and narrow concentrator outlets</title><desc id="d">A broad schematic outlet aligns with a broad working section and a narrow outlet with a smaller placement task.</desc><rect width="720" height="240" fill="#fffdf8"/><g font-family="Arial" fill="#173c39"><text x="80" y="35" font-size="18" font-weight="bold">Wider outlet</text><text x="445" y="35" font-size="18" font-weight="bold">Narrower outlet</text></g><rect x="55" y="65" width="235" height="48" rx="18" fill="#d9e7df" stroke="#315f59" stroke-width="3"/><rect x="470" y="65" width="120" height="48" rx="18" fill="#d9e7df" stroke="#315f59" stroke-width="3"/><path d="M70 155H280" stroke="#875b3c" stroke-width="12" stroke-linecap="round"/><path d="M475 155H585" stroke="#875b3c" stroke-width="12" stroke-linecap="round"/><text x="88" y="190" font-family="Arial" font-size="15" fill="#173c39">broad working section</text><text x="460" y="190" font-family="Arial" font-size="15" fill="#173c39">selected placement</text><text x="20" y="225" font-family="Arial" font-size="13" fill="#173c39">Geometry only · not a measured airflow or temperature comparison</text></svg>
