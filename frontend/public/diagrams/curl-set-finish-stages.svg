<svg xmlns="http://www.w3.org/2000/svg" width="340" height="680" viewBox="0 0 340 680" role="img" aria-labelledby="title desc">
  <title id="title">Styled-curl formation, cooling and finishing choices</title>
  <desc id="desc">A released curl is formed and left to cool. One section can then keep more separation or become a softer wave. Both are possible intended finishes.</desc>
  <rect width="340" height="680" rx="16" fill="#f8f4ed"/>
  <g fill="#fffdf9" stroke="#c9c7bc"><rect x="10" y="10" width="320" height="205" rx="12"/><rect x="10" y="225" width="320" height="205" rx="12"/><rect x="10" y="440" width="320" height="230" rx="12"/></g>
  <g font-family="system-ui, sans-serif" fill="#244638" text-anchor="middle">
    <text x="170" y="42" font-size="19" font-weight="700">Form the intended shape</text>
    <text x="170" y="194" font-size="15">Follow the tool's instructions</text>
    <text x="170" y="258" font-size="19" font-weight="700">Let the set cool</text>
    <text x="170" y="397" font-size="15"><tspan x="170">Keep cooling separate</tspan><tspan x="170" dy="21">from finishing</tspan></text>
    <text x="170" y="475" font-size="19" font-weight="700">Try one section</text>
    <text x="95" y="618" font-size="15">Less separation</text>
    <text x="247" y="618" font-size="15">Softer wave</text>
    <text x="170" y="651" font-size="16" font-weight="650">Stop at the finish you want</text>
  </g>
  <g fill="none" stroke="#244638" stroke-width="3" stroke-linecap="round">
    <path d="M164 64 C208 72 208 94 164 102 C120 110 120 130 164 138 C204 146 204 164 164 173"/>
    <path d="M164 279 C208 287 208 309 164 317 C120 325 120 345 164 353 C193 359 202 365 188 376"/>
    <path d="M90 499 C119 506 119 523 90 530 C61 537 61 554 90 561 C119 568 119 584 90 592"/>
    <path d="M101 499 C130 506 130 523 101 530 C72 537 72 554 101 561 C130 568 130 584 101 592" stroke="#a45339" stroke-width="2"/>
    <path d="M242 499 C286 523 286 543 242 554 C205 566 205 580 242 592"/>
    <path d="M252 499 C296 523 296 543 252 554 C215 566 215 580 252 592" stroke="#a45339" stroke-width="2"/>
  </g>
  <g transform="translate(51 76) rotate(-15)" stroke="#244638" stroke-width="2"><rect x="0" y="0" width="14" height="55" rx="6" fill="#ead7b7"/><rect x="-3" y="54" width="20" height="33" rx="5" fill="#244638"/></g>
  <path d="M170 491 L170 605" stroke="#c9c7bc" stroke-dasharray="4 5"/>
</svg>
