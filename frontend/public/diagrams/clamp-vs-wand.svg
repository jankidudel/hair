<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title desc"><title id="title">Clamp iron versus clipless wand handling</title><desc id="desc">A clamp bar holds a section end against the left barrel. On the right, a section wraps around a wand without a clamp and the end stays hand controlled. Follow the exact model instructions.</desc><rect width="720" height="190" fill="#fffdf8"/><text x="18" y="29" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173c39">Two ways to control the section end</text><rect x="91" y="83" width="217" height="47" rx="23" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><path d="M160 79h103" stroke="#173c39" stroke-width="9" stroke-linecap="round"/><path d="M55 61q57 20 99 22l9 38" fill="none" stroke="#395a54" stroke-width="6" stroke-linecap="round"/><text x="200" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">clamp holds the end</text><rect x="444" y="83" width="215" height="47" rx="23" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><path d="M413 100q17-44 53-40t40 68q24-69 59-67t39 67" fill="none" stroke="#395a54" stroke-width="6" stroke-linecap="round"/><path d="M411 100l-34-18" stroke="#395a54" stroke-width="6" stroke-linecap="round"/><text x="550" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">hand-guided wrap and end</text><text x="18" y="183" font-family="Arial,sans-serif" font-size="11" fill="#52645f">Schematic only · position, grip and release follow the exact tool manual</text></svg>
