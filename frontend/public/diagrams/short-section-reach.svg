<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title desc"><title id="title">Short section reach around different barrels</title><desc id="desc">The same illustrative free section is shown next to a smaller and a larger cylinder. The larger cylinder requires a longer path to travel around its surface; no minimum hair length or product dimension is implied.</desc><rect width="720" height="190" fill="#fffdf8"/><text x="18" y="29" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173c39">Can the section travel around the barrel?</text><circle cx="193" cy="101" r="32" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><circle cx="531" cy="101" r="53" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><path d="M40 99h105q15-42 49-42t43 47" fill="none" stroke="#395a54" stroke-width="6" stroke-linecap="round"/><path d="M365 99h108q20-67 58-67t62 73" fill="none" stroke="#395a54" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 7"/><circle cx="40" cy="99" r="6" fill="#173c39"/><circle cx="365" cy="99" r="6" fill="#173c39"/><text x="110" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">root and free section</text><text x="250" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">smaller path</text><text x="520" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">larger path to check</text><text x="18" y="183" font-family="Arial,sans-serif" font-size="11" fill="#52645f">Schematic only · dashed path is a handling question, not a measured result</text></svg>
