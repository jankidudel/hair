<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title desc"><title id="title">Continuous heatless rod over the crown</title><desc id="desc">A front-view section map shows one rod centred over the crown, with left and right hair sections wrapping separately down each side toward the ends.</desc><rect width="720" height="190" fill="#fffdf8"/><text x="18" y="29" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173c39">One rod, two sides of hair</text><path d="M247 75q113-82 226 0" fill="none" stroke="#bd8b69" stroke-width="19" stroke-linecap="round"/><path d="M247 75q-26 32-34 87m260-87q26 32 34 87" fill="none" stroke="#bd8b69" stroke-width="19" stroke-linecap="round"/><path d="M302 69q-32 25-49 54t-19 45m28-95q-43 33-60 83m216-87q32 25 49 54t19 45m-28-95q43 33 60 83" fill="none" stroke="#395a54" stroke-width="6" stroke-linecap="round"/><circle cx="360" cy="62" r="5" fill="#173c39"/><path d="M360 56V38m-160 99h-82m402 0h82" fill="none" stroke="#173c39" stroke-width="2"/><text x="360" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">crown midpoint</text><text x="113" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">left sections</text><text x="607" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">right sections</text><text x="18" y="183" font-family="Arial,sans-serif" font-size="11" fill="#52645f">Schematic only · wrap and secure each side according to the set's instructions</text></svg>
