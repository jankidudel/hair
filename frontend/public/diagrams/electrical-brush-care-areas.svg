    <text x="27" y="260" font-size="16"><tspan x="27">Rear filter is not removable </tspan><tspan x="27" dy="22">on this named model</tspan></text>
    <text x="27" y="364"><tspan x="27">Heated smoothing brush </tspan><tspan x="27" dy="23">example: original glide contact </tspan><tspan x="27" dy="23">surface and bristle gaps</tspan></text>
