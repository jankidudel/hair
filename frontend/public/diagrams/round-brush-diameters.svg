<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Round brush diameters</title><desc id="desc">Concentric core and bristle-tip circles distinguish solid barrel diameter from the larger outside-bristle diameter.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Round brush diameters</text><circle cx="159" cy="169" r="58" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><circle cx="159" cy="169" r="82" fill="none" stroke="#315f59" stroke-width="2"/><line x1="101" y1="169" x2="217" y2="169" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><text x="159" y="158" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">core</text><text x="159" y="185" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">diameter</text><line x1="77" y1="264" x2="241" y2="264" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><text x="159" y="287" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">outside tips</text><line x1="217" y1="169" x2="240" y2="169" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="209" y1="198" x2="229" y2="210" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="188" y1="219" x2="200" y2="239" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="159" y1="227" x2="159" y2="250" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="130" y1="219" x2="119" y2="239" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="109" y1="198" x2="89" y2="210" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="101" y1="169" x2="78" y2="169" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="109" y1="140" x2="89" y2="129" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="130" y1="119" x2="118" y2="99" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="159" y1="111" x2="159" y2="88" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="188" y1="119" x2="200" y2="99" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><line x1="209" y1="140" x2="229" y2="128" stroke="#875b3c" stroke-width="2" stroke-linecap="round" /><text x="275" y="115" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Inner circle:</text><text x="275" y="138" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">solid barrel</text><text x="275" y="200" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Outer circle:</text><text x="275" y="223" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">bristle envelope</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>