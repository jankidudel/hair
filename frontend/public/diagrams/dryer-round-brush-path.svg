<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Dryer and brush path</title><desc id="desc">A narrow hair section rests over a round brush while dryer airflow follows the section toward the ends; the brush unwinds to release.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Dryer and brush path</text><line x1="70" y1="105" x2="420" y2="105" stroke="#875b3c" stroke-width="7" stroke-linecap="round" /><text x="70" y="85" fill="#173c39" font-family="Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">root</text><text x="420" y="85" fill="#173c39" font-family="Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="end">ends</text><circle cx="205" cy="156" r="43" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><rect x="50" y="204" width="110" height="42" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><line x1="170" y1="225" x2="327" y2="127" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M319 121 L327 127 L319 133" fill="none" stroke="#315f59" stroke-width="3"/><text x="275" y="246" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">air along section</text><line x1="210" y1="215" x2="280" y2="215" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M272 209 L280 215 L272 221" fill="none" stroke="#315f59" stroke-width="3"/><text x="305" y="220" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">unwind</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>