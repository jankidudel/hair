<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Round and paddle paths</title><desc id="desc">Round heated barrel supports a curved dry section path; paddle head supports a broader straighter dry section path.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Round and paddle paths</text><text x="20" y="68" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Round barrel</text><circle cx="110" cy="138" r="50" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><line x1="65" y1="123" x2="156" y2="123" stroke="#875b3c" stroke-width="8" stroke-linecap="round" /><text x="200" y="145" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">curved section path</text><text x="20" y="225" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Paddle head</text><rect x="25" y="238" width="180" height="49" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><line x1="230" y1="264" x2="435" y2="264" stroke="#875b3c" stroke-width="8" stroke-linecap="round" /><text x="275" y="238" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">broad pass</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>