<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title desc"><title id="title">Plate width compared with outer housing width</title><desc id="desc">Top view of a straightener jaw: the heated plate sits inside the wider outer housing. Separate arrows indicate each width; drawing is not to scale.</desc><rect width="720" height="190" fill="#fffdf8"/><text x="18" y="30" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173c39">Plate width and housing width are different</text><rect x="154" y="58" width="410" height="76" rx="26" fill="#e2e8df" stroke="#395a54" stroke-width="3"/><rect x="207" y="71" width="304" height="50" rx="8" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><text x="359" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fffdf8">heated plate</text><path d="M154 48h410m-410-6v12m410-12v12" stroke="#173c39" stroke-width="2"/><text x="359" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">outer housing width</text><path d="M207 145h304m-304-6v12m304-12v12" stroke="#875b3c" stroke-width="2"/><text x="359" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#875b3c">plate width</text><text x="18" y="182" font-family="Arial,sans-serif" font-size="11" fill="#52645f">Schematic only · check the exact model's published dimensions</text></svg>
