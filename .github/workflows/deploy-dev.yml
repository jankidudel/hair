name: Deploy dev site
# Deployment is intentionally disabled until AWS infrastructure is configured.
on:
  push: { branches: [main], paths: ['frontend/**', 'package*.json'] }
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    if: ${{ false }} # Disable deployment until AWS infrastructure is configured.
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run content:check && npm run build --workspace=frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          {
            role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}',
            aws-region: '${{ vars.AWS_REGION }}',
          }
      - run: aws s3 sync frontend/dist/hair-frontend/browser "s3://${{ vars.SITE_BUCKET }}" --delete
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'
