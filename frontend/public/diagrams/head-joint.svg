<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title desc"><title id="title">Fixed and detachable hot-air brush heads</title><desc id="desc">The original one-piece brush is shown with head and handle joined continuously. The Plus is shown with a detachable oval head, a visible release joint and separate handle.</desc><rect width="720" height="190" fill="#fffdf8"/><text x="18" y="29" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173c39">Where the head meets the handle changes ownership</text><ellipse cx="161" cy="91" rx="88" ry="42" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><rect x="240" y="73" width="93" height="36" rx="12" fill="#395a54"/><path d="M251 74v34" stroke="#875b3c" stroke-width="3"/><text x="199" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c39">Original: fixed head</text><ellipse cx="486" cy="91" rx="82" ry="42" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><rect x="579" y="73" width="98" height="36" rx="12" fill="#395a54"/><rect x="567" y="71" width="9" height="40" rx="3" fill="#fffdf8" stroke="#875b3c" stroke-width="2"/><path d="M575 54V41" stroke="#875b3c" stroke-width="2"/><text x="575" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#875b3c">release joint</text><text x="539" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c39">Plus: detachable head</text><text x="18" y="183" font-family="Arial,sans-serif" font-size="11" fill="#52645f">Schematic only · head shape and dimensions are not to scale</text></svg>
