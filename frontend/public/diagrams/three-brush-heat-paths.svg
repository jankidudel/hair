<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Three brush heat paths</title><desc id="desc">Manual brush uses a separate dryer; airflow brush has an airflow head; heated round brush shapes already-dry hair with a heated barrel.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Three brush heat paths</text><text x="20" y="70" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Manual brush + dryer</text><rect x="25" y="82" width="66" height="37" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><circle cx="203" cy="101" r="23" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><line x1="100" y1="101" x2="168" y2="101" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M160 95 L168 101 L160 107" fill="none" stroke="#315f59" stroke-width="3"/><text x="255" y="107" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">separate airflow</text><text x="20" y="157" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Airflow brush</text><rect x="25" y="169" width="115" height="39" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><circle cx="176" cy="188" r="23" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><line x1="145" y1="188" x2="151" y2="188" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M143 182 L151 188 L143 194" fill="none" stroke="#315f59" stroke-width="3"/><text x="255" y="194" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">airflow head</text><text x="20" y="244" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Heated round brush</text><rect x="25" y="256" width="115" height="39" rx="12" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><circle cx="176" cy="275" r="23" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><text x="255" y="281" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">dry-stage barrel</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>