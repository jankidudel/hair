<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Roller preparation stages</title><desc id="desc">Heated rollers start in a heating unit, then move to a section; self-grip rollers use a separate dryer stage before an unheated roller.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Roller preparation stages</text><text x="20" y="67" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Heated kit</text><rect x="25" y="82" width="115" height="58" rx="12" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><text x="82" y="116" fill="#173c39" font-family="Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">heating unit</text><line x1="155" y1="111" x2="240" y2="111" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M232 105 L240 111 L232 117" fill="none" stroke="#315f59" stroke-width="3"/><circle cx="290" cy="111" r="31" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><text x="338" y="118" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">section</text><text x="20" y="191" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Self-grip kit</text><rect x="25" y="208" width="115" height="58" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="82" y="243" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">dryer</text><line x1="155" y1="237" x2="240" y2="237" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M232 231 L240 237 L232 243" fill="none" stroke="#315f59" stroke-width="3"/><circle cx="290" cy="237" r="31" fill="#f3e9db" stroke="#315f59" stroke-width="2"/><text x="338" y="244" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">roller</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>