<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Fine strand and density</title><desc id="desc">Fine describes strand feel; density changes the number of sections, not a mandatory hotter setting or larger head.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Fine strand and density</text><text x="20" y="65" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Fine strands, lower density</text><line x1="30" y1="88" x2="30" y2="138" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="65" y1="88" x2="65" y2="138" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="100" y1="88" x2="100" y2="138" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="135" y1="88" x2="135" y2="138" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="170" y1="88" x2="170" y2="138" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><text x="20" y="207" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Fine strands, higher density</text><line x1="30" y1="225" x2="30" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="49" y1="225" x2="49" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="68" y1="225" x2="68" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="87" y1="225" x2="87" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="106" y1="225" x2="106" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="125" y1="225" x2="125" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="144" y1="225" x2="144" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="163" y1="225" x2="163" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="182" y1="225" x2="182" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><line x1="201" y1="225" x2="201" y2="275" stroke="#875b3c" stroke-width="3" stroke-linecap="round" /><text x="270" y="116" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">one section</text><text x="270" y="251" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">divide further</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>