<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">Diffuser fit measurements</title><desc id="desc">Side view of a dryer outlet entering a diffuser collar. A marks the outside diameter of the dryer outlet at the grip point; B marks how deep the collar overlaps the outlet; C marks the open airflow path, which must stay clear. Schematic, not to scale.</desc><rect width="480" height="440" rx="16" fill="#f4f0e8"/><g font-family="Arial, sans-serif" fill="#203c32"><text x="20" y="34" font-size="20" font-weight="700">Three things to check</text><rect x="40" y="120" width="210" height="90" rx="10" fill="#d3dfd5" stroke="#315548" stroke-width="2"/><text x="70" y="172" font-size="15">Dryer outlet</text><path d="M200 108 L300 108 L300 100 L330 80 L430 80 L430 250 L330 250 L300 230 L300 222 L200 222" fill="none" stroke="#a5532f" stroke-width="2.5"/><text x="345" y="170" font-size="15" fill="#a5532f">Diffuser</text><line x1="228" y1="120" x2="228" y2="210" stroke="#203c32" stroke-width="2.5"/><path d="M223 128 L228 120 L233 128" fill="none" stroke="#203c32" stroke-width="2.5"/><path d="M223 202 L228 210 L233 202" fill="none" stroke="#203c32" stroke-width="2.5"/><text x="210" y="112" font-size="15" font-weight="700">A</text><line x1="200" y1="270" x2="250" y2="270" stroke="#203c32" stroke-width="2.5"/><path d="M208 265 L200 270 L208 275" fill="none" stroke="#203c32" stroke-width="2.5"/><path d="M242 265 L250 270 L242 275" fill="none" stroke="#203c32" stroke-width="2.5"/><line x1="200" y1="222" x2="200" y2="278" stroke="#203c32" stroke-dasharray="3 3"/><line x1="250" y1="210" x2="250" y2="278" stroke="#203c32" stroke-dasharray="3 3"/><text x="219" y="296" font-size="15" font-weight="700">B</text><line x1="255" y1="145" x2="320" y2="145" stroke="#315548" stroke-width="2"/><path d="M312 140 L320 145 L312 150" fill="none" stroke="#315548" stroke-width="2"/><line x1="255" y1="165" x2="320" y2="165" stroke="#315548" stroke-width="2"/><path d="M312 160 L320 165 L312 170" fill="none" stroke="#315548" stroke-width="2"/><line x1="255" y1="185" x2="320" y2="185" stroke="#315548" stroke-width="2"/><path d="M312 180 L320 185 L312 190" fill="none" stroke="#315548" stroke-width="2"/><text x="280" y="215" font-size="15" font-weight="700">C</text><text x="20" y="338" font-size="15"><tspan font-weight="700">A</tspan> Outlet outside diameter at the grip point</text><text x="20" y="362" font-size="15"><tspan font-weight="700">B</tspan> Collar depth: how far it overlaps the outlet</text><text x="20" y="386" font-size="15"><tspan font-weight="700">C</tspan> Airflow path left open, not blocked</text><text x="20" y="418" font-size="13">Schematic, not to scale. A maker exclusion overrides a match.</text></g></svg>
