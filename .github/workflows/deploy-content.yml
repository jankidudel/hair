name: Deploy content

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-content-prod
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/frontend-validation.yml
    with:
      build-production-artifact: false

  deploy:
    needs: [validate]
    name: Deploy content to prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build --workspace=frontend
      - name: Check generated SEO output
        run: npm run check:generated-seo --workspace=frontend
      - name: Check generated internal links
        run: npm run check:internal-links
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
      - name: Upload assets and revalidate entry documents
        run: bash .github/scripts/deploy-frontend-assets.sh frontend/dist/hair-frontend/browser "s3://${{ vars.SITE_BUCKET }}" "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
      - name: Verify published editorial release
        run: npm run seo:smoke-release
