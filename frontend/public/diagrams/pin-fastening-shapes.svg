<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480" role="img" aria-labelledby="title desc"><title id="title">Three pin mechanisms</title><desc id="desc">Closed arms, open wire prongs and a rigid two-prong body shown separately; not to scale.</desc><rect width="320" height="480" fill="#fffdf8"/><g fill="#173c39" font-family="Arial,sans-serif" font-size="20"><text x="16" y="30" font-weight="bold">Closed bobby pin</text><path d="M275 70 L70 70 Q35 70 55 86 L78 80 L98 86 L118 80 L138 86 L158 80 L178 86 L198 80 L218 86 L270 83" fill="none" stroke="#315f59" stroke-width="5" stroke-linecap="round"/><text x="16" y="118">Closed arms</text><text x="16" y="173" font-weight="bold">Open wire U pin</text><path d="M80 280 L78 215 Q80 185 108 204 Q114 210 114 220 L112 280" fill="none" stroke="#315f59" stroke-width="4" stroke-linecap="round"/><text x="140" y="244">Open wire</text><text x="140" y="268">prongs</text><text x="16" y="333" font-weight="bold">Rigid French pin</text><path d="M78 449 L68 383 Q66 355 108 355 Q150 355 148 383 L138 449 L126 386 Q124 375 108 375 Q92 375 90 386 Z" fill="#eacbaa" stroke="#315f59" stroke-width="3"/><text x="165" y="391">Rigid</text><text x="165" y="415">two-prong</text><text x="165" y="439">body</text></g></svg>