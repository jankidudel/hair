<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Cord and charge stages</title><desc id="desc">Corded iron is connected during styling. Cordless iron charges on a dock, then styles cable-free and returns to charge.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Cord and charge stages</text><text x="20" y="68" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Corded</text><rect x="25" y="83" width="90" height="51" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="70" y="114" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">outlet</text><line x1="115" y1="108" x2="260" y2="108" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><rect x="260" y="83" width="140" height="51" rx="12" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><text x="330" y="114" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">styling</text><text x="20" y="194" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Cordless</text><rect x="25" y="208" width="100" height="55" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="75" y="241" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">dock</text><line x1="137" y1="236" x2="246" y2="236" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M238 230 L246 236 L238 242" fill="none" stroke="#315f59" stroke-width="3"/><rect x="255" y="208" width="155" height="55" rx="12" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><text x="332" y="241" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">cable-free use</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>