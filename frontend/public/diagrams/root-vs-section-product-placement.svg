<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">Root targeting and section distribution</title><desc id="desc">Two matching hair-section outlines show a small root application area and an extended section application area. The areas illustrate placement, with no dose or performance scale.</desc><defs><clipPath id="root-area"><path d="M39 145 Q91 102 143 145 L139 399 Q91 423 43 399Z"/></clipPath><clipPath id="section-area"><path d="M217 145 Q269 102 321 145 L317 399 Q269 423 221 399Z"/></clipPath></defs><rect width="360" height="560" rx="16" fill="#f4f0e8"/><g font-family="Arial, sans-serif" fill="#203c32"><text x="20" y="35" font-size="20" font-weight="700">Where will it be applied?</text><text x="27" y="78" font-size="18">Root targeting</text><text x="202" y="78" font-size="18">Distribution</text><path d="M39 145 Q91 102 143 145 L139 399 Q91 423 43 399Z" fill="#fffdf8" stroke="#315548" stroke-width="2"/><path d="M217 145 Q269 102 321 145 L317 399 Q269 423 221 399Z" fill="#fffdf8" stroke="#315548" stroke-width="2"/><path d="M47 151 Q91 120 135 151 L135 179 Q91 158 47 179Z" fill="#d6a950"/><path d="M225 153 Q269 122 313 153 L309 387 Q269 405 229 387Z" fill="#a7c6b2"/><rect x="33" y="120" width="116" height="62" fill="#e2bd69" clip-path="url(#root-area)"/><rect x="211" y="130" width="116" height="270" fill="#c3d9b4" clip-path="url(#section-area)"/><path d="M47 184L57 388 M73 177L78 398 M98 175L100 398 M123 181L120 390 M232 181L240 385 M255 174L260 393 M282 174L281 393 M302 184L300 385" fill="none" stroke="#315548" stroke-width="1.5"/><text x="33" y="438" font-size="15">Selected root area</text><text x="211" y="438" font-size="15">Selected section</text><text x="20" y="483" font-size="16">Schematic, not to scale</text><text x="20" y="511" font-size="15">Shading indicates application area.</text><text x="20" y="536" font-size="15">It gives no dose or expected lift.</text></g></svg>