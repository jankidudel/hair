<svg xmlns="http://www.w3.org/2000/svg" width="340" height="700" viewBox="0 0 340 700" role="img" aria-labelledby="title">
<title id="title">Airflow-wrap control stages: preparation, guidance, cooling and model-specific release</title>
<rect width="340" height="700" rx="16" fill="#fffaf3"/>
<g font-family="Arial, sans-serif" fill="#283b3a"><g transform="translate(0 12)"><rect x="12" y="0" width="316" height="160" rx="12" fill="#f0ece5" stroke="#71837b"/><text x="28" y="26" font-size="16" font-weight="700"><tspan x="28" dy="0">Prepare and choose direction</tspan></text><text x="28" y="57" font-size="14" font-weight="400"><tspan x="28" dy="0">Use the exact attachment&#x27;s</tspan><tspan x="28" dy="19">starting state</tspan></text><circle cx="39" cy="126" r="13" fill="#294d49"/><text x="35" y="131" font-size="14" font-weight="700" fill="#fff"><tspan x="35" dy="0">1</tspan></text><path d="M95 111q30-13 60 0m-60 8q30-13 60 0m-60 8q30-13 60 0" fill="none" stroke="#8b573f" stroke-width="3"/><rect x="222" y="103" width="23" height="43" rx="10" fill="none" stroke="#294d49" stroke-width="3"/><path d="M180 113h25m-6-6 7 6-7 6" fill="none" stroke="#294d49" stroke-width="2"/></g><g transform="translate(0 184)"><rect x="12" y="0" width="316" height="160" rx="12" fill="#e7f2ee" stroke="#71837b"/><text x="28" y="26" font-size="16" font-weight="700"><tspan x="28" dy="0">Present and guide the wrap</tspan></text><text x="28" y="57" font-size="14" font-weight="400"><tspan x="28" dy="0">Keep neighbouring strands</tspan><tspan x="28" dy="19">separate</tspan></text><circle cx="39" cy="126" r="13" fill="#294d49"/><text x="35" y="131" font-size="14" font-weight="700" fill="#fff"><tspan x="35" dy="0">2</tspan></text><rect x="170" y="95" width="24" height="55" rx="11" fill="#fffaf3" stroke="#294d49" stroke-width="3"/><path d="M109 112q21-13 59 0t26 12q-40 16-27 19" fill="none" stroke="#8b573f" stroke-width="3"/><path d="M220 104q-12 7-16 17m25 4q-15 2-24 12" fill="none" stroke="#294d49" stroke-width="2" stroke-dasharray="4 4"/></g><g transform="translate(0 356)"><rect x="12" y="0" width="316" height="160" rx="12" fill="#eef0f8" stroke="#71837b"/><text x="28" y="26" font-size="16" font-weight="700"><tspan x="28" dy="0">Complete the cooling stage</tspan></text><text x="28" y="57" font-size="14" font-weight="400"><tspan x="28" dy="0">Follow the model&#x27;s sequence</tspan></text><circle cx="39" cy="126" r="13" fill="#294d49"/><text x="35" y="131" font-size="14" font-weight="700" fill="#fff"><tspan x="35" dy="0">3</tspan></text><path d="M178 101v47m-20-35 40 23m-40 0 40-23m-24-8 4-4 4 4m-4 39-4-4m4 4 4-4" stroke="#44627e" stroke-width="3" fill="none"/><path d="M223 114h37m-37 11h28m-28 11h37" stroke="#44627e" stroke-width="2" stroke-dasharray="6 4"/></g><g transform="translate(0 528)"><rect x="12" y="0" width="316" height="160" rx="12" fill="#f6e9df" stroke="#71837b"/><text x="28" y="26" font-size="16" font-weight="700"><tspan x="28" dy="0">Use the documented</tspan><tspan x="28" dy="19">release cue</tspan></text><text x="28" y="72" font-size="14" font-weight="400"><tspan x="28" dy="0">Reduced airflow is not</tspan><tspan x="28" dy="19">universal power-off</tspan></text><circle cx="39" cy="126" r="13" fill="#294d49"/><text x="35" y="131" font-size="14" font-weight="700" fill="#fff"><tspan x="35" dy="0">4</tspan></text><path d="m94 128 7 7 15-19" fill="none" stroke="#294d49" stroke-width="3"/><rect x="178" y="109" width="20" height="35" rx="9" fill="none" stroke="#294d49" stroke-width="3"/><path d="M223 110v33m-7-8 7 9 7-9" fill="none" stroke="#294d49" stroke-width="3"/></g></g>
</svg>
