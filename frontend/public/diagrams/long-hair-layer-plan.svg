<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Long hair layer plan</title><desc id="desc">Upper lengths are clipped clear; one lower section crosses the working brush; an open end path is left for unwinding.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Long hair layer plan</text><rect x="36" y="72" width="408" height="58" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="240" y="107" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">clipped upper layers</text><line x1="65" y1="172" x2="412" y2="172" stroke="#875b3c" stroke-width="8" stroke-linecap="round" /><text x="240" y="160" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">one active section</text><circle cx="202" cy="229" r="36" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><line x1="250" y1="230" x2="390" y2="230" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M382 224 L390 230 L382 236" fill="none" stroke="#315f59" stroke-width="3"/><text x="390" y="269" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="end">clear release path</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>