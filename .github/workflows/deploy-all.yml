name: Deploy all

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-all-prod
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/frontend-validation.yml
    with:
      build-production-artifact: false

  deploy:
    needs: [validate]
    name: Deploy all to prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Verify Google site verification configuration
        if: ${{ env.GOOGLE_SITE_VERIFICATION == '' }}
        run: |
          echo "::error::GOOGLE_SITE_VERIFICATION is not available in the prod GitHub Environment."
          exit 1
      - name: Build API package for deployment
        run: npm run build --workspace=@hair/api
      - name: Verify contact site key
        run: |
          if [[ -z "$TURNSTILE_SITE_KEY" ]]; then
            echo "::error::Set TURNSTILE_SITE_KEY in the prod GitHub Environment."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
      - name: Show infrastructure changes
        working-directory: infra
        run: npx cdk diff Hair-prod
      - name: Deploy infrastructure and API
        working-directory: infra
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [[ -z "$TURNSTILE_SECRET" ]]; then
            echo "::error::Set TURNSTILE_SECRET in the prod GitHub Environment."
            exit 1
          fi
          npx cdk deploy Hair-prod --require-approval never --outputs-file cdk-outputs.json --parameters "TurnstileSecret=$TURNSTILE_SECRET"
          cat cdk-outputs.json
      - name: Build production frontend and articles
        run: npm run build --workspace=frontend
      - name: Check generated SEO output
        run: npm run check:generated-seo --workspace=frontend
      - name: Check generated internal links
        run: npm run check:internal-links
      - name: Upload frontend
        run: bash .github/scripts/deploy-frontend-assets.sh frontend/dist/hair-frontend/browser "s3://${{ vars.SITE_BUCKET }}" "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
      - name: Retire exact obsolete route documents
        run: node --import tsx scripts/cleanup-retired-route-documents.ts frontend/dist/hair-frontend/browser "s3://${{ vars.SITE_BUCKET }}" --execute
      - name: Verify published editorial release
        run: npm run seo:smoke-release
