<svg xmlns="http://www.w3.org/2000/svg" width="340" height="760" viewBox="0 0 340 760" role="img" aria-labelledby="title desc"><title id="title">Separate anchors on a hair bungee</title><desc id="desc">Conceptual constructions, without measured capacity, force or a universal fit rule.</desc><rect width="340" height="760" rx="16" fill="#fffaf3"/><g font-family="Arial, sans-serif" fill="#283b3a"><rect x="12" y="12" width="316" height="175" rx="12" fill="#edf3ef" stroke="#71837b"/><text x="24" y="39" font-size="15" font-weight="700"><tspan x="24" dy="0">Support and place the first anchor</tspan></text><text x="24" y="63" font-size="14" font-weight="400"><tspan x="24" dy="0">Keep the gathered tail supported</tspan></text><g fill="none" stroke="#71837b" stroke-width="3"><path d="M110 97q35 9 70 0l18 62q-44-12-88 0Z" fill="#e6ddd0"/><path d="M122 101l2 55m15-52 5 50m13-50 9 50m6-53 14 56" stroke-width="1.5"/></g><path d="M91 126v24q0 17 19 17h89q16 0 16-16v-17" fill="none" stroke="#294d49" stroke-width="3" stroke-linecap="round"/><path d="M126 114q-13-12-15 1t14 8h96q24 0 25 20" fill="none" stroke="#8b573f" stroke-width="3.5"/><path d="M246 143q13-10 14 3t-12 8" fill="none" stroke="#294d49" stroke-width="3"/><rect x="12" y="199" width="316" height="175" rx="12" fill="#edf3ef" stroke="#71837b"/><text x="24" y="226" font-size="15" font-weight="700"><tspan x="24" dy="0">Wrap with the loose end controlled</tspan></text><text x="24" y="250" font-size="14" font-weight="400"><tspan x="24" dy="0">No universal turn count</tspan></text><g fill="none" stroke="#71837b" stroke-width="3"><path d="M110 284q35 9 70 0l18 62q-44-12-88 0Z" fill="#e6ddd0"/><path d="M122 288l2 55m15-52 5 50m13-50 9 50m6-53 14 56" stroke-width="1.5"/></g><path d="M125 302q-13-11-14 1t13 8q-16 12 1 17h60q23-7 5-19" fill="none" stroke="#8b573f" stroke-width="3.5"/><path d="M192 308q20-15 40-8m-4-6 8 7-10 4" fill="none" stroke="#294d49" stroke-width="2" stroke-dasharray="4 3"/><path d="M238 301q14-8 15 4t-12 6" fill="none" stroke="#294d49" stroke-width="3"/><rect x="12" y="386" width="316" height="175" rx="12" fill="#edf3ef" stroke="#71837b"/><text x="24" y="413" font-size="15" font-weight="700"><tspan x="24" dy="0">Place the second anchor as directed</tspan></text><text x="24" y="437" font-size="14" font-weight="400"><tspan x="24" dy="0">The named hooks do not join</tspan><tspan x="24" dy="20">each other</tspan></text><g fill="none" stroke="#71837b" stroke-width="3"><path d="M110 471q35 9 70 0l18 62q-44-12-88 0Z" fill="#e6ddd0"/><path d="M122 475l2 55m15-52 5 50m13-50 9 50m6-53 14 56" stroke-width="1.5"/></g><path d="M125 487q-13-10-14 2t13 8h57q18 2 6 16h-61" fill="none" stroke="#8b573f" stroke-width="3.5"/><path d="M126 513q-11 12-13 1t9-11" fill="none" stroke="#294d49" stroke-width="3"/><path d="M91 490h14m-14 25h14" stroke="#71837b" stroke-width="1.5"/><rect x="12" y="573" width="316" height="175" rx="12" fill="#edf3ef" stroke="#71837b"/><text x="24" y="600" font-size="15" font-weight="700"><tspan x="24" dy="0">Release and unwind in control</tspan></text><text x="24" y="624" font-size="14" font-weight="400"><tspan x="24" dy="0">Support the tail before undoing</tspan></text><g fill="none" stroke="#71837b" stroke-width="3"><path d="M110 646q35 9 70 0l18 62q-44-12-88 0Z" fill="#e6ddd0"/><path d="M122 650l2 55m15-52 5 50m13-50 9 50m6-53 14 56" stroke-width="1.5"/></g><path d="M91 675v24q0 17 19 17h89q16 0 16-16v-17" fill="none" stroke="#294d49" stroke-width="3" stroke-linecap="round"/><path d="M125 662q-13-11-14 1t13 9h66q28 0 39 24" fill="none" stroke="#8b573f" stroke-width="3.5"/><path d="M229 696q15 10 17-4t-11-8" fill="none" stroke="#294d49" stroke-width="3"/><path d="M204 656q29-2 48 17m-2-8 5 11-12-1" fill="none" stroke="#294d49" stroke-width="2" stroke-dasharray="4 3"/><text x="24" y="737" font-size="14" font-weight="400"><tspan x="24" dy="0">Editorial release check</tspan></text></g></svg>
