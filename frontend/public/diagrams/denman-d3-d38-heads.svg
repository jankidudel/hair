<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">D3 styling head and D38 paddle formats</title><desc id="desc">A narrow styling head and broader paddle have different illustrative pin layouts. Head and pin geometry are unmeasured. No pad cutaway is shown.</desc><rect width="360" height="560" rx="16" fill="#f4f0e8"/><g font-family="Arial, sans-serif" fill="#203c32"><text x="20" y="35" font-size="20" font-weight="700">Compare the head format</text><text x="28" y="82" font-size="18">D3 styling head</text><text x="206" y="82" font-size="18">D38 paddle</text><path d="M65 135 Q94 118 123 135 L128 307 Q124 325 107 329 L107 422 Q94 438 81 422 L81 329 Q64 325 60 307Z" fill="#d3dfd5" stroke="#315548" stroke-width="2"/><path d="M209 136 Q252 111 295 136 Q311 174 305 288 Q298 319 266 327 L266 422 Q252 438 238 422 L238 327 Q207 319 200 288 Q193 174 209 136Z" fill="#d3dfd5" stroke="#315548" stroke-width="2"/><g fill="#315548"><circle cx="76" cy="167" r="3"/><circle cx="94" cy="167" r="3"/><circle cx="112" cy="167" r="3"/><circle cx="76" cy="191" r="3"/><circle cx="94" cy="191" r="3"/><circle cx="112" cy="191" r="3"/><circle cx="76" cy="215" r="3"/><circle cx="94" cy="215" r="3"/><circle cx="112" cy="215" r="3"/><circle cx="76" cy="239" r="3"/><circle cx="94" cy="239" r="3"/><circle cx="112" cy="239" r="3"/><circle cx="76" cy="263" r="3"/><circle cx="94" cy="263" r="3"/><circle cx="112" cy="263" r="3"/><circle cx="76" cy="287" r="3"/><circle cx="94" cy="287" r="3"/><circle cx="112" cy="287" r="3"/><circle cx="222" cy="166" r="3"/><circle cx="240" cy="166" r="3"/><circle cx="258" cy="166" r="3"/><circle cx="276" cy="166" r="3"/><circle cx="227" cy="190" r="3"/><circle cx="245" cy="190" r="3"/><circle cx="263" cy="190" r="3"/><circle cx="281" cy="190" r="3"/><circle cx="222" cy="214" r="3"/><circle cx="240" cy="214" r="3"/><circle cx="258" cy="214" r="3"/><circle cx="276" cy="214" r="3"/><circle cx="227" cy="238" r="3"/><circle cx="245" cy="238" r="3"/><circle cx="263" cy="238" r="3"/><circle cx="281" cy="238" r="3"/><circle cx="222" cy="262" r="3"/><circle cx="240" cy="262" r="3"/><circle cx="258" cy="262" r="3"/><circle cx="276" cy="262" r="3"/><circle cx="227" cy="286" r="3"/><circle cx="245" cy="286" r="3"/><circle cx="263" cy="286" r="3"/><circle cx="281" cy="286" r="3"/></g><text x="20" y="471" font-size="16">Schematic, not to scale</text><text x="20" y="497" font-size="15">Pin marks illustrate arrangement.</text><text x="20" y="520" font-size="15">Counts and spacing are not a product</text><text x="20" y="542" font-size="15">inventory or a measured fit record.</text></g></svg>