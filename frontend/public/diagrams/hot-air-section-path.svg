<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Hot-air brush section path</title><desc id="desc">Check the exact starting state, guide one manageable section along the airflow head toward the ends, then release without winding extra hair.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Hot-air brush section path</text><text x="20" y="65" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Check permitted starting state</text><rect x="25" y="78" width="160" height="45" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="105" y="106" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">prepared section</text><line x1="55" y1="175" x2="425" y2="175" stroke="#875b3c" stroke-width="7" stroke-linecap="round" /><circle cx="188" cy="223" r="35" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><line x1="225" y1="225" x2="369" y2="193" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M361 187 L369 193 L361 199" fill="none" stroke="#315f59" stroke-width="3"/><text x="276" y="267" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">move and release</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>