<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Root section placement</title><desc id="desc">A narrow crown section is supported near the root over a brush and directed upward; neighbouring hair stays outside the working strip.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Root section placement</text><line x1="30" y1="245" x2="450" y2="245" stroke="#b8c9be" stroke-width="5" stroke-linecap="round" /><text x="20" y="276" fill="#173c39" font-family="Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">head outline</text><circle cx="180" cy="196" r="40" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><line x1="160" y1="157" x2="248" y2="70" stroke="#875b3c" stroke-width="8" stroke-linecap="round" /><line x1="246" y1="147" x2="296" y2="86" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M288 80 L296 86 L288 92" fill="none" stroke="#315f59" stroke-width="3"/><text x="305" y="91" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">lift direction</text><line x1="270" y1="196" x2="400" y2="196" stroke="#875b3c" stroke-width="5" stroke-linecap="round" /><text x="286" y="220" fill="#173c39" font-family="Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">neighbouring hair</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>