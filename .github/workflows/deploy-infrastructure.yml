name: Deploy infrastructure

# Deployment is intentionally disabled until AWS infrastructure is configured.
on:
  push:
    branches: [main]
    # The root lockfile is shared by all npm workspaces. It must not make a
    # frontend-only dependency update deploy CDK or the API.
    paths: ['infra/**', 'api/**']
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and AWS stage to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infrastructure-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    # if: ${{ false }} # Remove when AWS infrastructure and GitHub Environments are ready.
    name: Deploy infrastructure ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
      STAGE: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run test && npm run infra:build
      - name: Show non-secret OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const encodedPayload = token.split('.')[1];
            const claims = JSON.parse(Buffer.from(encodedPayload, 'base64url').toString('utf8'));
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              environment: claims.environment,
            }, null, 2));
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
      - name: Show infrastructure changes
        run: npm run infra:diff:${{ env.STAGE }}
      - name: Deploy infrastructure and API
        working-directory: infra
        run: |
          npm run synth
          npx cdk deploy "Hair-$STAGE" --require-approval never --outputs-file cdk-outputs.json
          cat cdk-outputs.json
