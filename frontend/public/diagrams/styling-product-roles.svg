<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" width="320" height="470" role="img" aria-labelledby="title desc">
<title id="title">Styling product roles can overlap</title><desc id="desc">Preparation, styling and finishing blocks overlap because one formula can serve several roles. Not every routine needs every step.</desc>
<rect width="320" height="470" rx="16" fill="#fffdf8"/>
<g font-family="Arial,sans-serif" fill="#173c39" text-anchor="middle">
<text x="160" y="35" font-size="21" font-weight="bold">Choose useful roles</text>
<rect x="24" y="62" width="272" height="126" rx="20" fill="#d9e7df" stroke="#315f59" stroke-width="2"/>
<rect x="24" y="164" width="272" height="126" rx="20" fill="#efe1cb" fill-opacity="0.85" stroke="#875b3c" stroke-width="2"/>
<rect x="24" y="266" width="272" height="126" rx="20" fill="#d9e7df" fill-opacity="0.85" stroke="#315f59" stroke-width="2"/>
<text x="160" y="110" font-size="22" font-weight="bold">Preparation</text><text x="160" y="142" font-size="18">Manageability</text>
<text x="160" y="212" font-size="22" font-weight="bold">Styling</text><text x="160" y="244" font-size="18">Arrange the finish</text>
<text x="160" y="314" font-size="22" font-weight="bold">Finishing</text><text x="160" y="346" font-size="18">Targeted final touches</text>
<text x="160" y="426" font-size="18">Roles overlap.</text><text x="160" y="451" font-size="18">Choose only needed steps.</text></g></svg>
