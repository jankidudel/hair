<svg xmlns="http://www.w3.org/2000/svg" width="340" height="640" viewBox="0 0 340 640" role="img" aria-labelledby="title desc">
  <title id="title">Two finishing spray coverage plans</title>
  <desc id="desc">The same highlighted side section appears in an overall spray pass and an application towards the intended area. Neither is a universal instruction.</desc>
  <rect width="340" height="640" rx="18" fill="#f7f3eb"/>
  <g font-family="system-ui, sans-serif" fill="#264b3c">
    <text x="24" y="34" font-size="19" font-weight="650">Plan your coverage</text>
    <text x="24" y="58" font-size="14">Illustration of coverage,</text>
    <text x="24" y="78" font-size="14">not a spray-distance instruction</text>
    <rect x="16" y="98" width="308" height="250" rx="14" fill="#fffdf8" stroke="#d9d2c5"/>
    <text x="34" y="129" font-size="18" font-weight="650">Overall pass</text>
    <rect x="16" y="366" width="308" height="250" rx="14" fill="#fffdf8" stroke="#d9d2c5"/>
    <text x="34" y="397" font-size="18" font-weight="650">Intended area</text>
  </g>
  <defs>
    <g id="head" fill="none" stroke="#264b3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M145 45 C108 45 91 73 93 112 L97 144 Q99 162 121 176 L121 189 M163 176 Q184 161 188 139 L190 102 C190 66 177 45 145 45Z"/>
      <path d="M121 189 Q99 191 85 206 M163 176 L163 189 Q185 191 200 206 M103 91 Q125 83 135 65 Q153 91 181 97"/>
      <path d="M104 101 Q97 117 103 133 M177 101 Q184 117 178 133"/>
      <path d="M101 100 Q113 105 114 120 L113 151 Q104 145 101 130Z" fill="#bd7158" stroke="#bd7158" opacity="0.75"/>
    </g>
  </defs>
  <use href="#head" x="30" y="130"/>
  <use href="#head" x="30" y="398"/>
  <g fill="none" stroke="#bd7158" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7">
    <path d="M70 199 L123 178 M70 205 L151 200 M70 211 L187 220 M70 217 L192 247 M70 223 L175 275"/>
    <path d="M70 473 L132 501 M70 480 L134 511 M70 487 L136 524"/>
  </g>
  <g fill="#264b3c">
    <rect x="44" y="200" width="19" height="49" rx="4"/>
    <rect x="49" y="191" width="12" height="10" rx="2"/>
    <rect x="44" y="468" width="19" height="49" rx="4"/>
    <rect x="49" y="459" width="12" height="10" rx="2"/>
  </g>
</svg>
