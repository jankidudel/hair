<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Round and paddle section paths</title><desc id="desc">A section curves around part of a round heated barrel; a broad section follows a straight path across a paddle head.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#875b3c"/></marker></defs><rect width="480" height="330" fill="#fffdf8"/>
  <text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Round and paddle paths</text><text x="20" y="67" fill="#173c39" font-family="Arial,sans-serif" font-size="16">Round barrel</text>
  <circle cx="112" cy="135" r="48" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><path d="M54 119 C70 69 150 66 169 119 C178 144 164 168 143 181" fill="none" stroke="#875b3c" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="200" y="127" fill="#173c39" font-family="Arial,sans-serif" font-size="16">section curves around</text><text x="200" y="149" fill="#173c39" font-family="Arial,sans-serif" font-size="16">the generic surface</text>
  <text x="20" y="225" fill="#173c39" font-family="Arial,sans-serif" font-size="16">Paddle head</text><rect x="25" y="238" width="180" height="49" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><path d="M42 263 H428" fill="none" stroke="#875b3c" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="245" y="238" fill="#173c39" font-family="Arial,sans-serif" font-size="16">broad, straighter pass</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13">Schematic only · not to scale</text>
</svg>
