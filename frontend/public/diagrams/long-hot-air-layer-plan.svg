<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Long hair layer plan</title><desc id="desc">Upper hair is clipped clear while one lower section crosses the head and exits without repeated wrapping.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Long hair layer plan</text><rect x="30" y="74" width="420" height="62" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="240" y="112" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">clipped upper layers</text><line x1="55" y1="175" x2="420" y2="175" stroke="#875b3c" stroke-width="8" stroke-linecap="round" /><text x="240" y="160" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">one working section</text><circle cx="190" cy="231" r="35" fill="#ead8c8" stroke="#315f59" stroke-width="2"/><line x1="230" y1="230" x2="390" y2="230" stroke="#315f59" stroke-width="3" stroke-linecap="round" /><path d="M382 224 L390 230 L382 236" fill="none" stroke="#315f59" stroke-width="3"/><text x="390" y="269" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="end">clear exit</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>