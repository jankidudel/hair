name: Frontend validation

on:
  workflow_call:
    inputs:
      build-production-artifact:
        description: Build and inspect the generated production artifact
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run validate:prebuild
      - run: npm run build --workspace=frontend
        if: ${{ inputs.build-production-artifact }}
      - run: npm run check:generated-seo
        if: ${{ inputs.build-production-artifact }}
      - run: npm run check:internal-links
        if: ${{ inputs.build-production-artifact }}
      - uses: actions/setup-node@v6
        with: { node-version: 26 }
      - name: Verify API on Node.js 26
        run: |
          npm run build --workspace=@hair/api
          npm run test --workspace=@hair/api
      - name: Upload generated site on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-output
          path: frontend/dist/hair-frontend/browser
          if-no-files-found: ignore
