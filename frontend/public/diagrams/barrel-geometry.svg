<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title desc"><title id="title">Curling barrel diameter, length and taper</title><desc id="desc">A straight barrel has the same diameter along its working length. A tapered wand narrows toward the tip. Arrows distinguish diameter from usable barrel length.</desc><rect width="720" height="190" fill="#fffdf8"/><text x="18" y="29" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173c39">Measure the working barrel, not the handle</text><rect x="42" y="81" width="82" height="40" rx="9" fill="#e2e8df" stroke="#395a54" stroke-width="2"/><rect x="124" y="73" width="209" height="56" rx="22" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><path d="M142 57h175m-175-6v12m175-12v12m213 0h150m-150-6v12m150-12v12" fill="none" stroke="#173c39" stroke-width="2"/><text x="230" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">working length</text><path d="M346 73v56m-6-56h12m-12 56h12" stroke="#875b3c" stroke-width="2"/><text x="361" y="105" font-family="Arial,sans-serif" font-size="13" fill="#875b3c">diameter</text><rect x="427" y="81" width="76" height="40" rx="9" fill="#e2e8df" stroke="#395a54" stroke-width="2"/><path d="M503 73 Q590 83 681 94 L681 108 Q590 119 503 129Z" fill="#bd8b69" stroke="#875b3c" stroke-width="2"/><text x="591" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">tapered working length</text><text x="180" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">constant diameter</text><text x="585" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c39">diameter changes</text><text x="18" y="183" font-family="Arial,sans-serif" font-size="11" fill="#52645f">Schematic only · dimensions vary by exact model</text></svg>
