<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Round-brush support, airflow and release</title><desc id="desc">A hair section contacts the upper curve of a round brush. Airflow follows the section from roots toward ends, and a separate curved arrow shows rotational release.</desc>
  <defs><marker id="ga" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315f59"/></marker><marker id="ba" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#875b3c"/></marker></defs><rect width="480" height="330" fill="#fffdf8"/>
  <text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Support, airflow and release</text><circle cx="220" cy="175" r="48" fill="#ead8c8" stroke="#315f59" stroke-width="2"/>
  <path d="M60 146 C125 145 164 124 220 127 C278 130 329 146 421 146" fill="none" stroke="#875b3c" stroke-width="8" stroke-linecap="round"/><text x="68" y="126" fill="#173c39" font-family="Arial,sans-serif" font-size="14">root</text><text x="421" y="126" text-anchor="end" fill="#173c39" font-family="Arial,sans-serif" font-size="14">ends</text>
  <rect x="38" y="219" width="106" height="42" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><path d="M143 222 C210 183 300 159 397 153" fill="none" stroke="#315f59" stroke-width="4" marker-end="url(#ga)"/><text x="278" y="214" fill="#173c39" font-family="Arial,sans-serif" font-size="15">airflow follows section</text>
  <path d="M185 244 A61 61 0 0 0 274 226" fill="none" stroke="#875b3c" stroke-width="4" marker-end="url(#ba)"/><text x="287" y="248" fill="#173c39" font-family="Arial,sans-serif" font-size="15">rotate to release</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13">Schematic only · not to scale</text>
</svg>
