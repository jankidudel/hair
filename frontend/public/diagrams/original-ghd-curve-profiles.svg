<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
  <title id="title">Original ghd Curve barrel profiles</title>
  <desc id="desc">Parallel-sided 32mm Soft Curl Tong with a simplified clamp, and Creative Curl Wand tapering from 28mm to 23mm. Lengths are schematic.</desc>
  <rect width="360" height="480" rx="16" fill="#f4f0e8"/>
  <g font-family="Arial, sans-serif" fill="#203c32">
    <text x="24" y="35" font-size="20" font-weight="700">Original Curve profiles</text>
    <text x="24" y="78" font-size="18">Soft Curl Tong · 32mm</text>
    <path d="M72 108H252V172H72Z" fill="#d3dfd5" stroke="#315548" stroke-width="2"/>
    <path d="M86 118H236V130H86Z" fill="#bd795e" stroke="#734b3e"/>
    <path d="M160 118V97H240" fill="none" stroke="#734b3e" stroke-width="2"/>
    <text x="24" y="205" font-size="16">Terracotta strip: simplified clamp</text>
    <text x="24" y="250" font-size="18">Creative Curl Wand</text>
    <path d="M72 285L252 290V336L72 341Z" fill="#d3dfd5" stroke="#315548" stroke-width="2"/>
    <text x="48" y="370" font-size="16">28mm</text>
    <text x="227" y="370" font-size="16">23mm</text>
    <text x="24" y="414" font-size="16">Barrel profiles only;</text>
    <text x="24" y="437" font-size="16">not a curl-result illustration</text>
    <text x="24" y="462" font-size="14">Lengths are schematic</text>
  </g>
</svg>
