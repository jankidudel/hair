<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc"><title id="title">Two closure paths</title><desc id="desc">Flexi rod bends its ends inward around a section; foam roller uses a separate snap tab that opens before unwinding.</desc><rect width="480" height="330" fill="#fffdf8"/><text x="20" y="31" fill="#173c39" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Two closure paths</text><text x="20" y="67" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Flexi rod · bent ends</text><line x1="90" y1="126" x2="390" y2="126" stroke="#875b3c" stroke-width="18" stroke-linecap="round" /><line x1="90" y1="126" x2="90" y2="91" stroke="#875b3c" stroke-width="18" stroke-linecap="round" /><line x1="390" y1="126" x2="390" y2="91" stroke="#875b3c" stroke-width="18" stroke-linecap="round" /><text x="20" y="187" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Foam roller · snap tab</text><rect x="90" y="200" width="300" height="50" rx="25" fill="#eacbaa" stroke="#315f59" stroke-width="2"/><rect x="350" y="190" width="45" height="69" rx="12" fill="#d9e7df" stroke="#315f59" stroke-width="2"/><text x="240" y="283" fill="#173c39" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">open the tab before release</text><text x="20" y="314" fill="#173c39" font-family="Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Schematic only · not to scale</text></svg>